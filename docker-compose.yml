
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mynetwork

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    networks:
      - mynetwork

  rag-app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app 
    working_dir: /app  
    depends_on:
      - chroma
      - ollama
    networks:
      - mynetwork
    environment:
      - PYTHONPATH=/app

volumes:
  ollama-data:

networks:
  mynetwork:
    driver: bridge
